<!doctype html>
<html lang="zh-CN" data-theme="system">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Let's GPC</title>
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <img src="icons/icon-32.png" width="28" height="28" alt="">
        <div>
          <strong>Let's GPC</strong>
          <span id="summary" class="muted">正在读取状态…</span>
        </div>
      </div>
      <button id="theme" class="icon-button" type="button" aria-label="切换主题" title="切换主题">◐</button>
    </header>

    <main>
      <section class="master card">
        <div>
          <strong>隐私信号</strong>
          <p>GPC 与 Topics 防护</p>
        </div>
        <label class="switch" aria-label="启用隐私信号">
          <input id="global-toggle" type="checkbox">
          <span></span>
        </label>
      </section>

      <section id="unsupported" class="card unsupported" hidden>
        <strong>此页面不支持站点级控制</strong>
        <p>Chrome 内部页、扩展页、本地文件或当前地址类型不能保存为域名例外；全局网络规则仍可能生效。</p>
      </section>

      <div id="site-content" hidden>
        <section class="card">
          <div class="row top-row">
            <div class="domain-wrap">
              <span class="eyebrow">当前网站</span>
              <strong id="domain" class="domain"></strong>
            </div>
            <label class="switch" aria-label="为当前网站发送 GPC">
              <input id="site-toggle" type="checkbox">
              <span></span>
            </label>
          </div>
          <div class="signal-grid">
            <div>
              <span>请求头（配置）</span>
              <output id="header-status" class="status-pill"></output>
            </div>
            <div>
              <span>页面 API</span>
              <output id="dom-status" class="status-pill">检测中</output>
            </div>
          </div>
          <p id="site-detail" class="site-detail muted" hidden></p>
          <button id="reload" class="button reload" type="button" hidden>刷新页面以完整应用</button>
        </section>

        <section class="card row">
          <div>
            <strong>Chrome Topics</strong>
            <p id="topics-detail">浏览器级关闭，不改写网站响应</p>
          </div>
          <label class="switch" aria-label="阻止 Chrome Topics">
            <input id="topics-toggle" type="checkbox">
            <span></span>
          </label>
        </section>

        <details class="card resource-card">
          <summary>
            <span>页面发现的资源域名</span>
            <span id="resource-count" class="status-pill">0</span>
          </summary>
          <p class="muted note">开关设置该域名以后作为顶层网站时的 GPC；不改变当前页面请求。仅按需读取已有 Resource Timing 条目。</p>
          <div id="resource-list" class="resource-list"></div>
        </details>

        <section class="card support-card">
          <div>
            <span class="eyebrow">网站声明</span>
            <strong id="support-status">检查 /.well-known/gpc.json…</strong>
          </div>
          <span id="support-date" class="muted"></span>
        </section>
      </div>

      <p id="error" class="error" role="alert" hidden></p>
    </main>

    <footer>
      <button id="options" class="button" type="button">域名列表与设置</button>
      <span class="muted">零依赖 · 本地存储</span>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
